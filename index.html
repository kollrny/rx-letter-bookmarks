</style></head><body><div class="shell"><header class="top"><span>一封旧信 / 八枚苹果书签</span><span>R / X</span></header><div class="motion-bar"><button class="motion-switch" id="motion" aria-pressed="false">暂停动效</button></div><main class="paper" id="app"></main><footer>一颗苹果，一点想念。<br><span>那些话，我还想接着做下去。</span></footer><p id="storage-note" class="storage"></p></div><script>const DATA=[{"title":"生活里，慢慢有了你","question":"在信的前面，我特别喜欢你什么“爆棚”的样子？","answer":"分享欲","reply":"小方老师，五月写这封信的时候，我说自己正在参与你的生活。现在再读，我还是喜欢这个说法。你讲给我的那些小事，让隔着距离的我们，也能知道彼此的一天是怎么过的。"},{"title":"原来，我也被认真记挂","question":"你在意我的消息，也发现我的情绪。那些小事让我觉得，第一次被人认真地怎样对待？","answer":"放在心上","reply":"信里写你会发现我不开心，会在我沉默的时候问怎么了。我那时候觉得珍贵，现在也该记得：你也需要这样的关心。我想把从你那里收到的认真，慢慢学着还给你。"},{"title":"害怕，也想走近你","question":"读到表白那一段，连续几句“怕”里，我最先写下的是哪一句？","answer":"怕你拒绝我","reply":"读到表白那一段，还是会想到那个怕被拒绝的自己。谢谢你那时候答应了我。后来想抱你、想见你、想去乌鲁木齐，这些写在纸上的愿望，真的有一些被我们一起走到了。"},{"title":"想让你放心说话","question":"信的中间，你提醒过我：不要让你说的话，变成伤害你的什么？","answer":"利剑","reply":"这一段，我想多停一会儿。你说过的话，我不能只记得句子好不好听，还要记得它为什么被说出口。你愿意跟我说自己的感受时，我想好好听完，让你能放心把话说下去。"},{"title":"第一次，认真想未来","question":"接着往下读。在那些对距离和现实的担心后，我说你是我的什么？","answer":"初恋","reply":"你是我的初恋。第一次认真想未来，也会有不知道该怎么办的时候。我想慢慢学会，担心的时候把话说明白，想你的时候告诉你，让你能知道我心里在想什么。"},{"title":"远方，有了一个方向","question":"读过挣钱、攒钱、让家里人放心的愿望，我希望以后能真的做到什么？摘下“真的”之后的五个字。","answer":"站在你身边","reply":"五月写想站在你身边，后来我真的见到了你，也抱到了你。现在再看那几行，距离就有了很具体的样子。我还想跟你一起走普通的路，也还要为下一次靠近认真准备。"},{"title":"愿望，要慢慢做出来","question":"读到生日祝福和接连几句“努力”，我想把哪两个字，从一句话变成真的？","answer":"以后","reply":"那封信快结束的时候，我写了好多句“努力”。今天把它们翻出来，也是在提醒自己：别把所有好听的话都留给以后。现在能回应你的消息、能听你说完的话，也要好好做到。"},{"title":"最后的回答，交给日子","question":"一直读到整封信最后。如果有人问你为什么选我，我希望你能笑着说什么？","answer":"因为他真的很爱我","reply":"最后那句话，我想继续留给你。你不用因为我写了一封信，就替我保证它会成真。我会接着做，也想接着写。谢谢你又陪我把这封信读到了最后，接下来，收好夹层里留给你的那一天。"}];

const $=id=>document.getElementById(id);
const STORE='rx-letter-apple-v4';
const clean=s=>s.normalize('NFKC').replace(/[\s，。！？、：；“”‘’"'「」]/g,'');
let state={found:[],page:-1,opened:false},canStore=true;
try{const saved=JSON.parse(localStorage.getItem(STORE));if(saved&&Array.isArray(saved.found)){state.found=[...new Set(saved.found.filter(i=>Number.isInteger(i)&&i>=0&&i<8))];state.page=Number.isInteger(saved.page)?Math.max(-1,Math.min(8,saved.page)):-1;state.opened=saved.opened===true&&state.found.length===8;}}catch(e){canStore=false;}
const has=i=>state.found.includes(i);
function save(){try{localStorage.setItem(STORE,JSON.stringify(state));}catch(e){canStore=false;}if(!canStore)$('storage-note').textContent='当前浏览器不能保存进度，先别关闭这一页。';else $('storage-note').textContent='读到的位置，会留在这台设备的这个浏览器里。';}
function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function go(n){state.page=n;save();render();window.scrollTo({top:0,behavior:'auto'});}
function nav(){return '<aside class="rail" aria-label="八枚书签">'+DATA.map((d,i)=>'<button data-page="'+i+'" aria-label="第'+(i+1)+'枚书签：'+d.title+'" aria-current="'+(state.page===i)+'" '+(i>0&&!has(i-1)?'disabled':'')+'>'+String(i+1).padStart(2,'0')+(has(i)?' · ✓':'')+'</button>').join('')+'<p>收好 '+state.found.length+' / 8 枚</p></aside>';}
function render(){
if(state.page===-1){$('app').innerHTML='<section class="stage"><div class="apple-art" aria-hidden="true"><div class="art-orbit"></div><span class="art-note">给小方老师</span><div class="art-envelope"><span>R &amp; X</span></div><div class="apple-main"><svg viewBox="0 0 100 110" fill="none" aria-hidden="true"><path d="M51 29Q49 15 58 8" stroke="#775b42" stroke-width="5" stroke-linecap="round"/><path d="M54 23C62 6 85 8 85 11C82 26 64 31 54 23Z" fill="#879e6d"/><path d="M50 34C22 13 2 43 12 73C18 95 35 105 50 97C67 107 84 93 90 70C99 39 77 17 50 34Z" fill="#c95d50"/><path d="M27 43Q17 52 22 67" stroke="#f8bd9e" stroke-width="6" stroke-linecap="round"/><path d="M48 37Q53 39 58 35" stroke="#a3423b" stroke-width="3" stroke-linecap="round"/></svg></div><div class="apple-little"><svg viewBox="0 0 100 110" fill="none" aria-hidden="true"><path d="M51 29Q49 15 58 8" stroke="#775b42" stroke-width="5" stroke-linecap="round"/><path d="M54 23C62 6 85 8 85 11C82 26 64 31 54 23Z" fill="#879e6d"/><path d="M50 34C22 13 2 43 12 73C18 95 35 105 50 97C67 107 84 93 90 70C99 39 77 17 50 34Z" fill="#c95d50"/><path d="M27 43Q17 52 22 67" stroke="#f8bd9e" stroke-width="6" stroke-linecap="round"/><path d="M48 37Q53 39 58 35" stroke="#a3423b" stroke-width="3" stroke-linecap="round"/></svg></div><i class="spark s1">✧</i><i class="spark s2">✧</i><span class="art-caption">有一点甜，留给你慢慢找。</span></div><div class="eyebrow">夹层里，新添了一张附页</div><h1>有些心事，<br>藏在<span class="apple-word">那封信</span>里。</h1><div class="rule"></div><p>小方老师：</p><p>欠你的那一页，我还记着。<br>这次，先往夹层里放进八枚小小的苹果书签。</p><p>它们从那封信的开头出发，<br>经过你把生活分享给我的时候，<br>也经过我害怕，却还是想靠近你的时候。<br>最后一枚，停在信的最后一句旁边。</p><p>五月的信没有改。<br>只是今天的我，又有一些话想接在后面。</p><p>把它放在手边，我们从头慢慢读。<br>不用赶时间，也不用凭记忆。<br>读到哪里，就在哪里停一会儿。</p><p class="sign">—— 盛同学</p><div class="actions"><button id="begin">'+(state.found.length?'接着读下去':'轻轻抽出第一枚书签')+'</button></div><p class="small">请先找到我最早写给你的那封生日信。钥匙，就藏在你收好的那些话里。</p></section>';$('begin').onclick=()=>go(Math.min(state.found.length,8));return;}
if(state.page===8){renderLast();return;}
const i=state.page,d=DATA[i];
$('app').innerHTML='<div class="layout">'+nav()+'<section class="stage"><div class="eyebrow">书签 '+String(i+1).padStart(2,'0')+' / 08 · 沿着原信往下读</div><div class="meter"><div style="width:'+state.found.length/8*100+'%"></div></div><h2>'+d.title+'</h2><div class="question"><p>'+d.question+'</p></div><form id="answer-form"><label for="key">把原信里的那几个字，留在这里</label><input id="key" autocomplete="off" value="'+(has(i)?d.answer:'')+'"><div class="actions"><button type="submit">'+(has(i)?'再读这段回应':'翻到书签背面')+'</button></div></form><p id="feedback" class="feedback" role="status"></p><section id="reply" class="reply '+(has(i)?'':'hidden')+'"><div class="eyebrow">今天，想接着说的话</div><p>'+d.reply+'</p></section><p class="small trail">线索留在这里，答案在你收好的第一封信里。</p><div class="actions"><button id="back" class="quiet">'+(i?'上一枚书签':'回到附页')+'</button><button id="next" '+(has(i)?'':'disabled')+'>'+(i===7?'把八枚书签放在一起':'收好，继续往下读')+'</button></div></section></div>';
