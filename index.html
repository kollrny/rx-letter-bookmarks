ton strong{font-family:"Songti SC",serif;font-size:22px;font-weight:400;display:block}.peel-button small{display:block;color:var(--muted);margin-top:10px}.reply{position:relative;background:#f0f1e7;border:1px solid #d7ddc7;border-radius:5px;padding:28px 30px;margin-top:24px;animation:unfold .65s ease both}.reply:before{content:"";position:absolute;top:-10px;right:35px;width:65px;height:22px;background:#c6d0ae80;transform:rotate(5deg)}.reply-title{display:flex;align-items:center;gap:12px;color:var(--green);font-size:11px;letter-spacing:2px}.reply-title svg{width:34px}.reply p{margin-bottom:0}.sign{text-align:right;font-family:"Songti SC",serif;font-size:13px}.collection-head{text-align:center;max-width:600px;margin:auto}.collection{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:35px 0 25px}.collection-item{padding:16px 8px 12px;background:transparent;border:1px dashed #c4c6af;border-radius:12px;min-width:0}.collection-item svg{width:90px;margin:0 auto 8px;filter:drop-shadow(2px 4px 2px #6f61431c);transform:rotate(var(--tilt))}.collection-item span{display:block;font-size:11px;line-height:1.7}.collection-item small{font:10px Georgia;color:var(--green);letter-spacing:2px}.letter-details{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:18px 0}.letter-details summary{cursor:pointer;font-size:13px;line-height:1.8}.endletter{max-width:620px;margin:25px auto}.endletter p{margin:0 0 22px}.cipher-section{max-width:620px;margin:40px auto 0}.cipher-section h2{font-size:28px}.cipher{font:clamp(30px,6vw,46px)/1.4 Georgia,serif;letter-spacing:7px;text-align:center;padding:24px 10px;border:1px solid var(--line);background:#f0efe5;border-radius:6px;margin:26px 0}.ending{margin:45px auto 10px;max-width:620px;text-align:center;border-top:1px dashed #bfc4ac;padding-top:35px}.ending h2{font-size:clamp(28px,5vw,42px);margin:20px 0}.ending p{font-family:"Songti SC",serif;font-size:18px;line-height:2.2}.stamp{width:170px;margin:10px auto 20px;p </style></head><body><header><div class="brand"><span style="color:#b7463d">♡</span> R &amp; X <span style="font-size:10px;letter-spacing:1px;color:#77776a">写给小方老师</span></div><div class="header-actions"><button id="home">封面</button><button id="motion" aria-pressed="false">暂停动效</button></div></header><main id="app"></main><footer class="foot"><span>慢慢来。这一点喜欢，不用赶着读完。</span><span id="storage-note"></span></footer><script>const DATA=[{"title":"生活里，慢慢有了你","question":"在信的前面，我特别喜欢你什么“爆棚”的样子？","answer":"分享欲","reply":"你讲起一天里的小事，我就觉得，自己也悄悄走进了你的生活。隔着那么远，还能知道你今天为什么笑，我很喜欢。"},{"title":"原来，我也被认真记挂","question":"你在意我的消息，也发现我的情绪。那些小事让我觉得，第一次被人认真地怎样对待？","answer":"放在心上","reply":"被你放在心上的感觉，我一直记得。那些没有见面的日子，因为你的一句惦记，也会变得暖一点。你给过我的认真，我也想好好给你。"},{"title":"害怕，也想走近你","question":"读到表白那一段，连续几句“怕”里，我最先写下的是哪一句？","answer":"怕你拒绝我","reply":"那时候，连喜欢你都说得小心翼翼。后来，我们真的见了面。纸上的想念有了声音，也有了拥抱的温度。"},{"title":"想让你放心说话","question":"信的中间，你提醒过我：不要让你说的话，变成伤害你的什么？","answer":"利剑","reply":"这句话，我一直留着。你愿意说给我听的心事，我想轻轻接住。开心可以讲，委屈也可以讲，在我这里，不用每句话都想很久。"},{"title":"第一次，认真想未来","question":"接着往下读。在那些对距离和现实的担心后，我说你是我的什么？","answer":"初恋","reply":"你是我的初恋。好多第一次，都有了你的名字。以后再想起这些日子，我想我还是会觉得：原来喜欢一个人，能记住这么多小事。"},{"title":"远方，有了一个方向","question":"读过挣钱、攒钱、让家里人放心的愿望，我希望以后能真的做到什么？摘下“真的”之后的五个字。","answer":"站在你身边","reply":"从想去乌鲁木齐，到你真的来车站接我，那几行字有了后来的故事。我记得车上那个紧紧的拥抱，也喜欢后来和你一起走过的普通的路。"},{"title":"愿望，要慢慢做出来","question":"读到生日祝福和接连几句“努力”，我想把哪两个字，从一句话变成真的？","answer":"以后","reply":"以前写下“以后”，想到的是很远的日子。现在也会想到很小的事：听你讲完今天，跟你说声晚安，把下一次见面认真放在心上。"},{"title":"最后的回答，交给日子","question":"一直读到整封信最后。如果有人问你为什么选我，我希望你能笑着说什么？","answer":"因为他真的很爱我","reply":"这句话，还是留给日子慢慢回答吧。我想做的，是让你每次回头，都能找到一些被认真喜欢着的证据。比如这封信，比如今天。"}];

const $=id=>document.getElementById(id);
const STORE='rx-letter-apple-v4';
const clean=s=>s.normalize('NFKC').replace(/[\p{P}\p{Z}\s]/gu,'');
let state={found:[],peeled:[],page:-1,opened:false},canStore=true,motionOff=false;
try{const old=JSON.parse(localStorage.getItem(STORE));if(old&&Array.isArray(old.found)){state.found=[...new Set(old.found.filter(i=>Number.isInteger(i)&&i>=0&&i<8))];state.peeled=Array.isArray(old.peeled)?[...new Set(old.peeled.filter(i=>state.found.includes(i)))]:[...state.found];state.page=-1; // Always welcome her on the cover; keep collected bookmarks.state.opened=old.opened===true&&state.peeled.length===8;}motionOff=localStorage.getItem('rx-motion')==='off';}catch(e){canStore=false}
const has=i=>state.found.includes(i),peeled=i=>state.peeled.includes(i);
const short=['分享','记挂','靠近','倾听','初恋','相见','以后','喜欢'];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function apple(i=0){const colors=['#bf5146','#789062','#d19856','#b64e44','#8d9b69','#ce7560','#a7aa70','#b84742'];return '<svg viewBox="0 0 120 130" fill="none" aria-hidden="true"><path d="M61 34C30 12 4 43 16 79C23 104 43 119 61 108C80 120 102 101 108 76C118 42 91 15 61 34Z" fill="'+colors[i%8]+'" stroke="#fffdf5" stroke-width="9" stroke-linejoin="round"/><path d="M61 35Q56 20 66 12" stroke="#fffdf5" stroke-width="12" stroke-linecap="round"/><path d="M61 35Q56 20 66 12" stroke="#705943" stroke-width="5" stroke-linecap="round"/><path d="M65 27C72 9 99 12 99 15C95 33 77 37 65 27Z" fill="#778b59" stroke="#fffdf5" stroke-width="5"/><path d="M33 47Q23 57 28 72" stroke="#fff1d4" stroke-width="7" stroke-linecap="round" opacity=".7"/><path d="M53 96Q63 101 72 96" stroke="#6e4827" stroke-width="2" stroke-linecap="round" opacity=".25"/></svg>'}
function save(){try{localStorage.setItem(STORE,JSON.stringify(state));}catch(e){canStore=false}const n=$('storage-note');if(n)n.textContent=canStore?'书签会留在这台设备的这个浏览器里。':'当前无法保存进度，请先不要关闭这一页。'}
function paintMotion(){document.body.classList.toggle('still',motionOff);$('motion').textContent=motionOff?'开启动效':'暂停动效';$('motion').setAttribute('aria-pressed',String(motionOff))}
function go(n){state.page=n;save();render();window.scrollTo({top:0,behavior:'auto'});const focus=$('page-title');if(focus)focus.focus({preventScroll:true})}
function nextUnread(){return DATA.findIndex((_,i)=>!peeled(i))}
function nav(){return '<nav class="rail" aria-label="已收好的书签">'+DATA.map((d,i)=>'<button data-page="'+i+'" aria-label="第'+(i+1)+'枚：'+d.title+(peeled(i)?'，已收好':'')+'" aria-current="'+(state.page===i?'step':'false')+'" class="'+(peeled(i)?'collected':'')+'" '+(i>0&&!peeled(i-1)?'disabled':'')+'>'+(peeled(i)?'<span class="mini">'+apple(i)+'</span>':'')+String(i+1).padStart(2,'0')+(peeled(i)?'<span class="tick"> ✓</span>':'')+'</button>').join('')+'<p>收好 '+state.peeled.length+' / 8</p></nav>'}
function bindNav(){document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>go(Number(b.dataset.page)))}
function render(){
 if(state.page===8&&state.peeled.length<8)state.page=nextUnread();
 if(state.page>0&&state.page<8&&!peeled(state.page-1))state.page=nextUnread();
 if(state.page===-1){$('app').innerHTML='<section class="paper hero"><div class="hero-copy"><div class="kicker">A little letter, just for you</div><h1 id="page-title" class="screen-focus" tabindex="-1">有些心事，<br>藏在<span class="accent">那封信</span>里。</h1><div class="rule"></div><div class="hero-note"><p>小方老师：</p><p>找出我最早写给你的那封生日信吧。<br>这次，想请你拿着它，<br>陪我慢慢拆开一点新的心意。</p><p>五月的信没有改。<br>只是今天的我，又想接着写一点。</p></div><div class="actions"><button id="begin" class="primary">'+(state.peeled.length===8?'看看收好的八枚书签':state.found.length?'接着慢慢读':'打开这份小心意')+'</button></div><p class="small">八枚苹果书签，陪你从开头读到最后。</p></div><div class="hero-art" aria-hidden="true"><div class="art-sheet"></div><span class="art-label">a little sweetness</span><span class="serial">LETTER / 01</span><span class="art-star">✧</span><div class="hero-apple">'+apple(0)+'</div><div class="little-sticker">'+apple(1)+'</div><span class="art-star second">✧</span><span class="art-bottom">写给你的小事，<br>都想好好收着。</span></div></section>';$('begin').onclick=()=>go(nextUnread()<0?8:nextUnread());return}
 if(state.page===8){renderLast();return}
 const i=state.page,d=DATA[i];
 $('app').innerHTML='<div class="layout">'+nav()+'<section class="paper"><div class="chapter-head"><span class="kicker">A piece of our story</span><span class="small">'+String(i+1).padStart(2,'0')+' / 08</span></div><div class="meter" aria-label="已收好'+state.peeled.length+'枚"><i style="width:'+state.peeled.length/8*100+'%"></i></div><h2 id="page-title" class="screen-focus" tabindex="-1">'+d.title+'</h2><div class="question"><p>'+d.question+'</p></div><form id="answer-form" '+(has(i)?'hidden':'')+'><label for="key">把原信里的那几个字，留在这里</label><input id="key" autocomplete="off" maxlength="80"><div class="actions"><button class="primary" type="submit">收下这枚书签</button></div></form><p id="feedback" class="feedback" role="status"></p><div id="peel-area" class="peel-area" '+(!has(i)||peeled(i)?'hidden':'')+'><button type="button" id="peel" class="peel-button" aria-label="揭开第'+(i+1)+'枚苹果贴纸，读背面的回信">'+apple(i)+'<span><strong>有一点甜，藏在背面。</strong><small>轻轻点一下，揭开这枚贴纸 ↗</small></span></button></div><section id="reply" class="reply" '+(!peeled(i)?'hidden':'')+' aria-label="书签背面的回信"><div class="reply-title">'+apple(i)+'<span>今天，想接着说的话</span></div><p>'+d.reply+'</p><p class="sign">—— 盛同学</p></section><div class="actions"><button id="back" class="quiet">'+(i?'上一枚':'回到封面')+'</button><button id="next" '+(!peeled(i)?'disabled':'')+'>'+(i===7?'把八枚书签放在一起':'收好，读下一枚')+'</button></div></section></div>';
 bindNav();$('back').onclick=()=>go(i-1);$('next').onclick=()=>go(i+1);
 $('answer-form').onsubmit=e=>{e.preventDefault();if(clean($('key').value)!==clean(d.answer)){$('feedback').textContent='这几个字还没对上。慢慢来，我等你。';$('key').setAttribute('aria-invalid','true');return}if(!has(i))state.found.push(i);save();$('answer-form').hidden=true;$('feedback').textContent='找到了。还有一句话，想亲手交给你。';$('peel-area').hidden=false;$('peel').focus({preventScroll:true})};

function cardSVG(){const art=DATA.map((_,i)=>'<g transform="translate('+(95+(i%4)*235)+' '+(210+Math.floor(i/4)*205)+')"><g transform="rotate('+(i%2?5:-5)+' 75 80)">'+apple(i).replace('<svg ','<svg width="150" height="163" ')+'</g><text x="75" y="188" text-anchor="middle" font-size="20" fill="#63754e">'+short[i]+'</text></g>').join('');return '<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1450" viewBox="0 0 1100 1450"><rect width="1100" height="1450" rx="18" fill="#f5f1e7"/><rect x="35" y="35" width="1030" height="1380" rx="8" fill="#fffcf5" stroke="#d8d5c4" stroke-width="2"/><g font-family="Georgia,Songti SC,SimSun,serif"><text x="550" y="105" text-anchor="middle" font-size="18" fill="#63754e" letter-spacing="6">EIGHT LITTLE KEEPSAKES</text><text x="550" y="165" text-anchor="middle" font-size="40" fill="#423e32">一点一点，把喜欢收好了。</text>'+art+'<path d="M110 680H990" stroke="#bfc4ac" stroke-width="2" stroke-dasharray="8 10"/><text x="550" y="785" text-anchor="middle" font-size="23" fill="#63754e">给那一天，留一个位置</text><text x="550" y="910" text-anchor="middle" font-size="90" fill="#b7463d">2026 · 12 · 12</text><g text-anchor="middle" font-size="29" fill="#423e32"><text x="550" y="1030">那封信里的后来，我们已经一起走过了一些。</text><text x="550" y="1095">还有一些，我想慢慢给你。</text><text x="550" y="1160">十二月十二日，记得回来。</text></g><text x="550" y="1320" text-anchor="middle" font-size="23" fill="#63754e" letter-spacing="8">R · X</text></g></svg>'}
function saveCard(preview){const svg=cardSVG(),url=URL.createObjectURL(new Blob([svg],{type:'image/svg+xml;charset=utf-8'})),img=new Image();$('card-note').textContent='正在把书签收进纪念卡……';img.onload=()=>{try{const canvas=document.createElement('canvas');canvas.width=1100;canvas.height=1450;const ctx=canvas.getContext('2d');ctx.drawImage(img,0,0);const png=canvas.toDataURL('image/png');const view=$('card-preview');view.src=png;view.hidden=!preview;if(preview){$('card-note').textContent='可以长按图片保存，也可以使用上面的保存按钮。';view.scrollIntoView({block:'nearest',behavior:'auto'})}else{const a=document.createElement('a');a.href=png;a.download='给小方老师的苹果纪念卡.png';document.body.appendChild(a);a.click();a.remove();$('card-note').textContent='纪念卡已准备好。若没有弹出保存，请点“展开纪念卡”长按图片。'}}catch(e){$('card-note').textContent='暂时无法生成图片，请稍后再试。'}finally{URL.revokeObjectURL(url)}};img.onerror=()=>{URL.revokeObjectURL(url);$('card-note').textContent='暂时无法生成图片，请稍后再试。'};img.src=url}
