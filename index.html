<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="robots" content="noindex, nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>夹层里 · 再陪我读一遍</title><style>
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#30212b;color:#423631;font-family:Georgia,"Songti SC","SimSun",serif;background-image:radial-gradient(ellipse at 20% 0,#694553,transparent 65%);min-height:100vh}button,input{font:inherit}button{cursor:pointer;border:1px solid #795764;background:#694654;color:#fff5e6;padding:13px 22px;border-radius:2px;font-size:14px;line-height:1.5}button:hover{background:#533542}button:disabled{opacity:.45;cursor:default}button:focus-visible,summary:focus-visible{outline:3px solid #c49752;outline-offset:4px}.quiet{background:transparent;color:#75515c;border-color:#c9b7a4}.quiet:hover{background:#e8dfd0}.hidden,[hidden]{display:none!important}.shell{max-width:1000px;margin:auto;padding:30px 24px 50px}.top{display:flex;justify-content:space-between;gap:12px;color:#d8c5ad;font-size:11px;letter-spacing:3px;margin-bottom:25px}.paper{position:relative;background:#f7f1e6;border-top:3px solid #b69a6f;padding:clamp(25px,5vw,64px);box-shadow:0 30px 85px #0e091650;min-height:550px}.paper:after{content:"";position:absolute;inset:12px;border:1px solid #b19b7b35;pointer-events:none}.eyebrow{font-size:11px;letter-spacing:4px;color:#846e57}h1{font-weight:400;font-size:clamp(31px,5vw,48px);line-height:1.5;margin:28px 0}h2{font-weight:400;font-size:clamp(25px,4vw,33px);line-height:1.6;margin:20px 0}p{font-size:16px;line-height:2.1}.small{font-size:13px;line-height:1.9;color:#75675e}.sign{text-align:right;margin-top:24px}.rule{width:40px;height:1px;background:#a48a64;margin:26px 0}.envelope{width:140px;height:92px;border:1px solid #bfa786;position:relative;margin:20px 0 36px;background:linear-gradient(33deg,transparent 49%,#c8b89e 50%,transparent 51%) left/50% 100% no-repeat,linear-gradient(-33deg,transparent 49%,#c8b89e 50%,transparent 51%) right/50% 100% no-repeat}.seal{position:absolute;left:51px;top:26px;width:38px;height:38px;border-radius:50%;background:#784755;color:#e5c8aa;display:grid;place-items:center;font-size:12px;box-shadow:0 2px 5px #46212b35}.layout{display:grid;grid-template-columns:150px 1fr;gap:35px}.rail{border-right:1px solid #cbbb9e;padding-right:22px}.rail button{display:block;width:100%;margin:0 0 10px;padding:10px 8px;text-align:left;font-size:12px;background:none;color:#725e55;border:0;border-bottom:1px solid #d6cbb8}.rail button[aria-current=true]{color:#693846;border-bottom-color:#693846;font-weight:bold}.rail p{font-size:12px;color:#806f61}.question{border-left:2px solid #b49a76;padding-left:20px;margin:24px 0}label{display:block;font-size:13px;margin:20px 0 8px}input{width:100%;background:transparent;border:0;border-bottom:1px solid #ad9680;padding:12px 2px;color:#4b3540;border-radius:0;font-size:18px}input:focus{outline:2px solid #9b7580;outline-offset:4px}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:20px}.feedback{font-size:13px;color:#80535b;min-height:26px}.reply{padding:22px 26px;background:#ede4d5;border:1px solid #d3c1a5;margin-top:24px}.reply p{margin-bottom:0}.quote{margin:20px 0;padding:10px 20px;background:#fffaf1;border-left:2px solid #bdab8c}.quote p{font-size:15px;line-height:2;margin:10px 0}details{margin:25px 0;font-size:13px;color:#716056}summary{cursor:pointer;line-height:1.8}.original{max-height:380px;overflow:auto;overscroll-behavior:contain}.meter{height:2px;background:#d9cdbc;margin:15px 0 24px}.meter div{height:100%;background:#8d586a;transition:width .4s}.cipher{font-size:clamp(28px,5vw,42px);letter-spacing:5px;color:#71434f;margin:26px 0}.keys{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}.key{padding:12px 7px;text-align:center;background:#ede1ce;border:1px solid #c7b394;min-width:43px}.key span{display:block;font-size:10px;color:#84705c;margin-bottom:8px}.key b{font-size:21px;font-weight:400}.date{font-size:clamp(28px,6vw,45px);letter-spacing:3px;margin:30px 0}.ending{text-align:center;padding:25px 0}.ending .rule{margin:25px auto}footer{text-align:center;color:#d0b8aa;font-size:12px;margin-top:24px;line-height:1.9;letter-spacing:2px}.endletter{padding:8px 0}.storage{font-size:11px;color:#bda89b;text-align:center}.stage{animation:rise .5s ease}@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}@media(max-width:650px){.shell{padding:18px 12px 30px}.top{font-size:10px;letter-spacing:1px}.layout{grid-template-columns:1fr;gap:12px}.rail{border:0;padding:0;display:flex;gap:4px;flex-wrap:wrap}.rail button{width:auto;flex:1;padding:8px 2px;text-align:center;font-size:11px;min-width:28px}.rail p{width:100%;margin:0}.paper{padding:30px 25px}.reply{padding:18px}.actions button{flex:1}.key{min-width:33px;padding:10px 5px}.keys{gap:5px}.original{max-height:320px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;animation:none!important;transition:none!important}}@media print{body{background:white}.shell{max-width:none}.paper{box-shadow:none}button,.top,footer,.rail,input,label{display:none}.original{max-height:none;overflow:visible}}
</style></head><body><div class="shell"><header class="top"><span>一封旧信 · 一张新添的附页</span><span>R / X</span></header><main class="paper" id="app"></main><footer>那些话，我还想接着做下去。</footer><p id="storage-note" class="storage"></p></div><script>const DATA=[{"title":"生活里，慢慢有了你","question":"在信的前面，我特别喜欢你什么“爆棚”的样子？","answer":"分享欲","reply":"小方老师，五月写这封信的时候，我说自己正在参与你的生活。现在再读，我还是喜欢这个说法。你讲给我的那些小事，让隔着距离的我们，也能知道彼此的一天是怎么过的。","original":["小方老师，生日快乐。","现在应该已经过零点了吧。","乌鲁木齐那边是不是还没睡。","我刚刚一个人坐着发呆的时候，突然想到，这是我陪你过的第一个生日。","然后我就突然特别想你。","其实我以前一直不太相信，真的会有人短短几十天就彻底闯进另一个人的生活里。","可你就是这样。","明明最开始只是你给我分享抖音视频，后来慢慢聊天，慢慢熟悉，慢慢每天都想找你，到最后，我已经习惯了生活里有你。","习惯了晚上等你一起听歌。","习惯了看见有趣的东西先想发给你。","习惯了睡前一定要看看你消息。","习惯了你突然叫我一声。","也习惯了……想你。","有时候我自己都觉得很神奇。","原来真的会有一个人，只是出现了一段时间，就能把另一个人的生活全部填满。","老婆。","其实你不知道，我有多喜欢你分享欲爆棚的样子。","你给我发视频的时候，给我讲工作里的事情的时候，跟我吐槽单位那些烦人的人的时候，我都会有一种很奇怪的感觉。","就是会突然觉得：","“原来我真的正在参与另一个人的生活。”","这种感觉对我来说特别珍贵。","因为以前没人会这样对我。","以前我总觉得自己好像是那种很普通、很容易被忽略的人。"]},{"title":"原来，我也被认真记挂","question":"你在意我的消息，也发现我的情绪。那些小事让我觉得，第一次被人认真地怎样对待？","answer":"放在心上","reply":"信里写你会发现我不开心，会在我沉默的时候问怎么了。我那时候觉得珍贵，现在也该记得：你也需要这样的关心。我想把从你那里收到的认真，慢慢学着还给你。","original":["可你不一样。","你会在意我有没有回消息。","会在意我开不开心。","会发现我情绪不对。","会在我沉默的时候问我怎么了。","这些事情你可能觉得没什么。","可我真的记了很久。","因为我是第一次被人这样认真地放在心上。","所以后来喜欢你，真的一点办法都没有。"]},{"title":"害怕，也想走近你","question":"读到表白那一段，连续几句“怕”里，我最先写下的是哪一句？","answer":"怕你拒绝我","reply":"读到表白那一段，还是会想到那个怕被拒绝的自己。谢谢你那时候答应了我。后来想抱你、想见你、想去乌鲁木齐，这些写在纸上的愿望，真的有一些被我们一起走到了。","original":["我到现在都记得跟你表白那天。","其实我那时候特别怕。","怕你拒绝我。","怕你觉得我幼稚。","怕你觉得我只是上头。","更怕你觉得，我现在什么都没有。","可你还是答应我了。","然后从那天开始，我就开始变得越来越贪心。","以前只是想每天跟你聊天。","后来开始想抱你。","想见你。","想去乌鲁木齐。","想以后。","想很久以后。"]},{"title":"想让你放心说话","question":"信的中间，你提醒过我：不要让你说的话，变成伤害你的什么？","answer":"利剑","reply":"这一段，我想多停一会儿。你说过的话，我不能只记得句子好不好听，还要记得它为什么被说出口。你愿意跟我说自己的感受时，我想好好听完，让你能放心把话说下去。","original":["其实有时候我也会偷偷难受。","尤其是你工作累的时候。","你明明已经很委屈了，还会装作没事。","明明被单位那些人影响情绪了，还会笑着跟我聊天。","你知道吗。","每次你这样的时候，我都会特别心疼。","因为我知道，你不是不难受。","你只是习惯自己扛。","还有那次你跟我说：","“不要把我说的话变成伤害我的利剑。”","我真的记了特别久。","因为那一瞬间，我突然特别想抱抱你。","我会想，你以前到底经历了什么，才会这么害怕自己认真说出口的话，最后反而变成别人伤害你的东西。","所以后来每次你问我：","“你是不是没那么喜欢我了。”","其实我都会很难受。","因为我知道，你不是想闹。","你只是害怕。","害怕有人突然不坚定。","害怕感情走着走着就散了。","害怕今天还说爱你的人，明天就冷淡了。","可老婆。"]},{"title":"第一次，认真想未来","question":"接着往下读。在那些对距离和现实的担心后，我说你是我的什么？","answer":"初恋","reply":"你是我的初恋。第一次认真想未来，也会有不知道该怎么办的时候。我想慢慢学会，担心的时候把话说明白，想你的时候告诉你，让你能知道我心里在想什么。","original":["其实我也会怕。","我怕距离。","怕现实。","怕叔叔阿姨觉得我不靠谱。","怕自己现在没工作，给不了你安全感。","更怕你有一天，对我失望。","因为你真的太重要了。","你是我初恋。","也是第一个让我开始认真想未来的人。","以前我从来没想过以后。"]},{"title":"远方，有了一个方向","question":"读过挣钱、攒钱、让家里人放心的愿望，我希望以后能真的做到什么？摘下“真的”之后的五个字。","answer":"站在你身边","reply":"五月写想站在你身边，后来我真的见到了你，也抱到了你。现在再看那几行，距离就有了很具体的样子。我还想跟你一起走普通的路，也还要为下一次靠近认真准备。","original":["可现在我会开始想：","以后怎么挣钱。","以后怎么攒钱。","以后怎么离你近一点。","以后怎么让你家里人放心。","以后怎么才能真的站在你身边。","有时候想到这些，我甚至会突然特别焦虑。","因为我太想跟你有结果了。","可我现在还不够厉害。","有时候你下班了，一个人在乌鲁木齐。","我在哈尔滨，只能隔着屏幕陪你。","那种无力感真的特别难受。","因为我舍不得你累。","舍不得你受委屈。","舍不得你一个人消化情绪。","可我现在却只能一遍一遍跟你说“别难过”。","所以我才会拼命想长大。","因为我真的不想只是嘴上说爱你。","我想以后你下班的时候，有人接你。","想以后你难受的时候，可以直接扑进我怀里哭。","想以后别人再欺负你的时候，你身后真的有人撑腰。","老婆。"]},{"title":"愿望，要慢慢做出来","question":"读到生日祝福和接连几句“努力”，我想把哪两个字，从一句话变成真的？","answer":"以后","reply":"那封信快结束的时候，我写了好多句“努力”。今天把它们翻出来，也是在提醒自己：别把所有好听的话都留给以后。现在能回应你的消息、能听你说完的话，也要好好做到。","original":["其实我特别感谢你来到我身边。","因为你让我第一次觉得：","原来我也是值得被爱的。","以前没人会一条一条给我分享视频。","没人会陪我听歌到半夜。","没人会因为我一句情绪不对就开始担心。","可你会。","所以有时候我会突然很怕。","怕以后再也遇不到像你这样的人了。","但幸好。","现在陪在我身边的人还是你。","最后。","生日快乐啊，小方老师。","新的一岁，我希望你少受一点委屈。","希望工作里的烦心事都离你远一点。","希望你不要总是一个人硬撑。","希望以后有人能一直坚定地站在你身边。","而我希望那个人，是我。","虽然我现在还没那么厉害。","虽然我现在还在慢慢长大。","但我会努力。","努力去见你。","努力变好。","努力挣钱。","努力把“以后”从一句话，变成真的。","因为我真的很想陪你很久很久。"]},{"title":"最后的回答，交给日子","question":"一直读到整封信最后。如果有人问你为什么选我，我希望你能笑着说什么？","answer":"因为他真的很爱我","reply":"最后那句话，我想继续留给你。你不用因为我写了一封信，就替我保证它会成真。我会接着做，也想接着写。谢谢你又陪我把这封信读到了最后，接下来，收好夹层里留给你的那一天。","original":["还有。","谢谢你喜欢我。","谢谢你愿意爱现在这个还不够成熟、偶尔会焦虑、会胡思乱想、甚至有点笨的我。","但你放心。","我会越来越好的。","为了以后能光明正大地站在你身边。","也为了以后别人再问你“为什么选他”的时候。","你能笑着说一句：","“因为他真的很爱我。”"]}];

const $=id=>document.getElementById(id);
const STORE='rx-letter-preview-v3';
const clean=s=>s.normalize('NFKC').replace(/[\s，。！？、：；“”‘’"'「」]/g,'');
let state={found:[],page:-1,opened:false},canStore=true;
try{const saved=JSON.parse(localStorage.getItem(STORE));if(saved&&Array.isArray(saved.found)){state.found=[...new Set(saved.found.filter(i=>Number.isInteger(i)&&i>=0&&i<8))];state.page=Number.isInteger(saved.page)?Math.max(-1,Math.min(8,saved.page)):-1;state.opened=saved.opened===true&&state.found.length===8;}}catch(e){canStore=false;}
const has=i=>state.found.includes(i);
function save(){try{localStorage.setItem(STORE,JSON.stringify(state));}catch(e){canStore=false;}if(!canStore)$('storage-note').textContent='当前浏览器不能保存进度，先别关闭这一页。';else $('storage-note').textContent='读到的位置，会留在这台设备的这个浏览器里。';}
function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function go(n){state.page=n;save();render();window.scrollTo({top:0,behavior:'auto'});}
function nav(){return '<aside class="rail" aria-label="八枚书签">'+DATA.map((d,i)=>'<button data-page="'+i+'" aria-label="第'+(i+1)+'枚书签：'+d.title+'" aria-current="'+(state.page===i)+'" '+(i>0&&!has(i-1)?'disabled':'')+'>'+String(i+1).padStart(2,'0')+(has(i)?' · ✓':'')+'</button>').join('')+'<p>收好 '+state.found.length+' / 8 枚</p></aside>';}
function render(){
if(state.page===-1){$('app').innerHTML='<section class="stage"><div class="envelope" aria-hidden="true"><span class="seal">R · X</span></div><div class="eyebrow">夹层里，新添了一张附页</div><h1>把那封信，<br>再陪我读一遍。</h1><div class="rule"></div><p>小方老师：</p><p>欠你的那一页，我还记着。<br>这次，先往夹层里放进八枚小小的书签。</p><p>它们从那封信的开头出发，<br>经过你把生活分享给我的时候，<br>也经过我害怕，却还是想靠近你的时候。<br>最后一枚，停在信的最后一句旁边。</p><p>五月的信没有改。<br>只是今天的我，又有一些话想接在后面。</p><p>把它放在手边，我们从头慢慢读。<br>不用赶时间，也不用凭记忆。<br>读到哪里，就在哪里停一会儿。</p><p class="sign">—— 盛同学</p><div class="actions"><button id="begin">'+(state.found.length?'接着读下去':'轻轻抽出第一枚书签')+'</button></div><p class="small">原信不在手边也没关系，每枚书签下都留着对应的原文。</p></section>';$('begin').onclick=()=>go(Math.min(state.found.length,8));return;}
if(state.page===8){renderLast();return;}
const i=state.page,d=DATA[i];
$('app').innerHTML='<div class="layout">'+nav()+'<section class="stage"><div class="eyebrow">书签 '+String(i+1).padStart(2,'0')+' / 08 · 沿着原信往下读</div><div class="meter"><div style="width:'+state.found.length/8*100+'%"></div></div><h2>'+d.title+'</h2><div class="question"><p>'+d.question+'</p></div><form id="answer-form"><label for="key">把原信里的那几个字，留在这里</label><input id="key" autocomplete="off" value="'+(has(i)?d.answer:'')+'"><div class="actions"><button type="submit">'+(has(i)?'再读这段回应':'翻到书签背面')+'</button></div></form><p id="feedback" class="feedback" role="status"></p><section id="reply" class="reply '+(has(i)?'':'hidden')+'"><div class="eyebrow">今天，想接着说的话</div><p>'+d.reply+'</p></section><details><summary>把原信这一段，展开读一读</summary><div class="quote original" tabindex="0" aria-label="第一封信对应原文">'+d.original.map(s=>'<p>'+esc(s)+'</p>').join('')+'</div><p class="small">这里保留了原信的文字；从第一枚到第八枚，依次就是整封信。</p></details><div class="actions"><button id="back" class="quiet">'+(i?'上一枚书签':'回到附页')+'</button><button id="next" '+(has(i)?'':'disabled')+'>'+(i===7?'把八枚书签放在一起':'收好，继续往下读')+'</button></div></section></div>';
document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>go(Number(b.dataset.page)));
$('back').onclick=()=>go(i-1);$('next').onclick=()=>go(i+1);
$('answer-form').onsubmit=e=>{e.preventDefault();const a=clean($('key').value);if(a===clean(d.answer)){if(!has(i))state.found.push(i);save();$('reply').classList.remove('hidden');$('feedback').textContent='找到了。书签背面，是今天想对你说的话。';$('next').disabled=false;const rail=document.querySelector('.rail p');rail.textContent='收好 '+state.found.length+' / 8 枚';document.querySelector('.meter div').style.width=state.found.length/8*100+'%';}else{$('feedback').textContent='再陪我看一眼这一段。照原信里的字写就好，标点不用管。';}};
}
function renderLast(){
if(state.found.length!==8){state.page=Math.min(...DATA.map((_,i)=>i).filter(i=>!has(i)));render();return;}
